model_name: custom_cnn
module: models.custom_cnn.model
run_name: custom_cnn_wish_s42_v1
seed: 42
device: auto
data:
  root: data/raw/wish
  manifest: data/manifests/wish_v1/manifest.csv
  near_duplicate_review: null
  batch_size: 16
  num_workers: 2
model:
  base_channels: 32
  num_blocks: 4
  dropout: 0.3
  num_classes: 2
train:
  epochs: 30
  early_stopping_patience: 6
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0005
  effective_batch_size: 32
  grad_clip_norm: 1.0
  mixed_precision: true
output:
  results_dir: results/custom_cnn
