# Custom CNN — owner: A
# Shared configuration format used by the team models.

model_name: custom_cnn

# ---- runtime ----
seed: 42

# ---- data ----
data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test
  cross_gen_dir: data/cross_gen_test

  image_size: 224
  batch_size: 32
  num_workers: 4

# ---- model ----
model:
  name: CustomCNN
  in_channels: 3
  num_classes: 2
  base_channels: 32
  num_blocks: 4
  dropout: 0.30

# ---- training ----
train:
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 30
  early_stopping_patience: 5
  optimizer: adam

# ---- output ----
output:
  results_dir: results/custom_cnn
  checkpoint_path: results/custom_cnn/best_model.pt