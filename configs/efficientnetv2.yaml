model_name: efficientnetv2
seed: 42

data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test
  cross_gen_dir: data/cross_gen_test
  image_size: 224
  batch_size: 32
  num_workers: 4

train:
  warmup_epochs: 8
  warmup_lr: 0.001
  finetune_epochs: 15
  finetune_lr: 0.00001
  unfreeze_last_n_blocks: 2
  weight_decay: 0.0001
  early_stopping_patience: 6
  optimizer: adam

output:
  results_dir: results/efficientnetv2
  checkpoint_path: results/efficientnetv2/best_model.pt
